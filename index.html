<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>祈飞财务结算 · 原型与 PRD</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#eef2f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.wrap{width:100%;max-width:560px}
.logo{display:inline-flex;width:44px;height:44px;border-radius:10px;background:#2878ff;color:#fff;font-size:20px;font-weight:700;align-items:center;justify-content:center;margin-bottom:18px}
h1{margin:0 0 6px;font-size:22px;font-weight:700}
.sub{margin:0 0 22px;font-size:13px;color:#7d8797}
.card{background:#fff;border:1px solid #e5e9f0;border-radius:10px;overflow:hidden}
a.item{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #eef2f7;text-decoration:none;color:#1f2937;transition:background .15s}
a.item:last-child{border-bottom:0}
a.item:hover{background:#f5f9ff}
.ico{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:600}
.ico.demo{background:#eaf2ff;color:#2878ff}
.ico.doc{background:#edf4ff;color:#41669b}
.ico.github{background:#f2f4f7;color:#4b5563}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:14px;font-weight:600}
.tx span{display:block;margin-top:3px;font-size:12px;color:#7d8797;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arw{flex:none;color:#c2cbd8;font-size:14px}
.foot{margin-top:14px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#98a2b3}
.badge{background:#e8f5ec;color:#1a7f37;border-radius:5px;padding:2px 8px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">汇</div>
  <h1>祈飞财务结算</h1>
  <p class="sub">商业结算平台 · 可交互原型与需求文档（v1.0 交付基线）</p>

  <div class="card">
    <a class="item" href="./qifei-settlement-demo.html">
      <span class="ico demo">▶</span>
      <span class="tx"><b>打开在线原型</b><span>qifei-settlement-demo.html · 单文件，无需构建</span></span>
      <span class="arw">›</span>
    </a>
    <a class="item" href="https://github.com/YeChangMian/qifei-finance-settlement/blob/main/qifei-settlement-prd.md">
      <span class="ico doc">≡</span>
      <span class="tx"><b>需求文档 PRD</b><span>含菜单结构、字段规则、交互约定与完整变更记录</span></span>
      <span class="arw">›</span>
    </a>
    <a class="item" href="https://github.com/YeChangMian/qifei-finance-settlement">
      <span class="ico github">⌥</span>
      <span class="tx"><b>源码仓库</b><span>YeChangMian/qifei-finance-settlement</span></span>
      <span class="arw">›</span>
    </a>
  </div>

  <div class="foot"><span>4 个菜单：商品维护 / 达播维护 / 特殊品牌结算 / 店铺档案</span><span class="badge">v1.0</span></div>
</div>
</body>
</html>
